{{define "main"}}{{$L := .L}}
<header class="page-head">
  <div class="sun" aria-hidden="true"></div>
  <div class="wrap"><h1>{{$L.T "nav.faq"}}</h1></div>
</header>
<section class="section" style="padding-top:8px">
  <div class="wrap">
    <div class="faq">{{template "faq-core" .}}{{template "faq-more" .}}</div>
    <p class="mt-l muted">{{$L.Pick "ยังมีคำถาม? โทรหาเราที่" "Still have a question? Call us on"}} <a href="tel:{{.Set.Str "phone"}}">{{.Set.Str "phone"}}</a></p>
  </div>
</section>
{{end}}

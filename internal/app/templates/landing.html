{{define "main"}}{{$L := .L}}{{$d := .Data}}
<section class="hero">
  <div class="wrap">
    <div class="sun" aria-hidden="true"></div>
    <div class="hero-copy">
      <h1 style="font-size:var(--step-3);max-width:14em">{{$d.Title}}</h1>
      {{range $d.Body}}{{if .}}<p class="lede">{{.}}</p>{{end}}{{end}}
      <div class="hero-cta"><a class="btn btn--primary" href="{{$L.Prefix}}/book{{if $d.Query}}?{{$d.Query}}{{end}}">{{$L.T "nav.book"}}</a></div>
      {{with .HoursLine}}<p class="hero-hours">{{template "ico-clock"}}<span>{{.}}</span></p>{{end}}
    </div>
  </div>
</section>
{{end}}

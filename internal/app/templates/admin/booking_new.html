{{define "main"}}{{$d := .Data}}{{$f := $d.Form}}{{$s := .Staff}}
<div class="topline"><h1>สร้างการจอง (Walk-in / โทร / LINE)</h1></div>
<form class="card" method="post" action="/admin/bookings/new" data-new-booking>
  <input type="hidden" name="csrf" value="{{.CSRF}}">
  <input type="hidden" name="idem" value="{{if $f.Get "idem"}}{{$f.Get "idem"}}{{else}}{{$d.Idem}}{{end}}">
  <input type="hidden" name="slot_id" value="{{if $f.Get "slot_id"}}{{$f.Get "slot_id"}}{{else}}{{$d.SlotID}}{{end}}">
  <h2>1. รอบ</h2>
  <div class="form-grid">
    <div class="field"><label for="date">วันที่</label><input type="date" id="date" name="date" value="{{if $f.Get "date"}}{{$f.Get "date"}}{{else}}{{$d.Date}}{{end}}"></div>
    <div class="field"><label for="product_id">แบบที่จอง</label><select id="product_id" name="product_id">{{range $d.Products}}<option value="{{.ID}}"{{if eq ($f.Get "product_id") (printf "%d" .ID)}} selected{{end}}>{{.NameTH}} · {{baht .Price}}{{if eq .PriceMode "per_person"}}/คน{{end}}{{if not .Public}} (ไม่แสดงบนเว็บ){{end}}</option>{{end}}</select></div>
    <div class="field"><label for="participants">จำนวนคน</label><input type="number" id="participants" name="participants" min="1" max="50" value="{{if $f.Get "participants"}}{{$f.Get "participants"}}{{else}}1{{end}}"></div>
  </div>
  <p class="muted" style="margin:12px 0 6px">เลือกรอบ:</p>
  <div class="btn-row" data-slots></div>

  <h2 style="margin-top:22px">2. ลูกค้า</h2>
  <div class="form-grid">
    <div class="field"><label for="name">ชื่อ</label><input type="text" id="name" name="name" required maxlength="120" value="{{$f.Get "name"}}"></div>
    <div class="field"><label for="phone">เบอร์โทร</label><input type="tel" id="phone" name="phone" maxlength="20" value="{{$f.Get "phone"}}"></div>
    <div class="field"><label for="email">อีเมล (ถ้ามี จะส่งใบยืนยันให้)</label><input type="email" id="email" name="email" maxlength="254" value="{{$f.Get "email"}}"></div>
    <div class="field"><label for="lang">ภาษา</label><select id="lang" name="lang"><option value="th">ไทย</option><option value="en"{{if eq ($f.Get "lang") "en"}} selected{{end}}>อังกฤษ</option></select></div>
    <div class="field"><label for="channel">ช่องทาง</label><select id="channel" name="channel">{{range $k, $v := dict "walk_in" "Walk-in" "phone" "โทรศัพท์" "line" "LINE" "admin" "อื่น ๆ"}}<option value="{{$k}}"{{if eq ($f.Get "channel") $k}} selected{{end}}>{{$v}}</option>{{end}}</select></div>
    <div class="field wide"><label for="note">ข้อความจากลูกค้า</label><input type="text" id="note" name="note" maxlength="500" value="{{$f.Get "note"}}"></div>
  </div>

  <h2 style="margin-top:22px">3. การชำระเงิน</h2>
  <div class="checks">
    <label class="check"><input type="radio" name="pay" value="venue"{{if or (eq ($f.Get "pay") "venue") (eq ($f.Get "pay") "")}} checked{{end}}> ชำระที่ร้าน (เก็บเงินตอนเช็คอิน)</label>
    <label class="check"><input type="radio" name="pay" value="online"{{if eq ($f.Get "pay") "online"}} checked{{end}}> ส่งลิงก์ให้ลูกค้าจ่ายออนไลน์ (กันที่ตามเวลาที่ตั้งค่า)</label>
    {{if $s.Can "bookings.override"}}<label class="check"><input type="radio" name="pay" value="complimentary"{{if eq ($f.Get "pay") "complimentary"}} checked{{end}}> ฟรี / มอบให้ (ผู้จัดการ)</label>{{end}}
  </div>
  <div class="form-grid" style="margin-top:12px">
    <div class="field"><label for="promo">โค้ดส่วนลด</label><input type="text" id="promo" name="promo" maxlength="30" value="{{$f.Get "promo"}}"></div>
    <div class="field"><label for="voucher">รหัสบัตร/แพ็กเกจ</label><input type="text" id="voucher" name="voucher" maxlength="30" value="{{$f.Get "voucher"}}"></div>
  </div>
  <div class="checks" style="margin-top:12px">
    <label class="check"><input type="checkbox" name="allow_dup"> อนุญาตเบอร์ซ้ำในรอบเดียวกัน</label>
    {{if $s.Can "bookings.override"}}<label class="check"><input type="checkbox" name="over"> อนุญาตเกินความจุ (ผู้จัดการ)</label>{{end}}
  </div>
  <div class="btn-row" style="margin-top:18px"><button class="btn btn--primary" type="submit">สร้างการจอง</button><a class="btn btn--ghost" href="/admin/calendar">ยกเลิก</a></div>
</form>
{{end}}

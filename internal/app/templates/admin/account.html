{{define "main"}}
<div class="topline"><h1>บัญชีของฉัน</h1></div>
<section class="card" style="max-width:520px">
  <dl class="kv"><dt>ชื่อ</dt><dd>{{.Staff.Name}}</dd><dt>อีเมล</dt><dd>{{.Staff.Email}}</dd><dt>ตำแหน่ง</dt><dd>{{.Staff.RoleName}}</dd></dl>
  <h2 style="margin-top:18px">เปลี่ยนรหัสผ่าน</h2>
  <form method="post" action="/admin/account">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <div class="field"><label for="current">รหัสผ่านปัจจุบัน</label><input type="password" id="current" name="current" required autocomplete="current-password"></div>
    <div class="field" style="margin-top:8px"><label for="new">รหัสผ่านใหม่ (10 ตัวขึ้นไป)</label><input type="password" id="new" name="new" required minlength="10" autocomplete="new-password"></div>
    <div class="field" style="margin-top:8px"><label for="confirm">พิมพ์รหัสผ่านใหม่อีกครั้ง</label><input type="password" id="confirm" name="confirm" required minlength="10" autocomplete="new-password"></div>
    <button class="btn btn--primary" style="margin-top:12px">เปลี่ยนรหัสผ่าน</button>
  </form>
  <p class="muted" style="margin-top:12px"><small>เมื่อเปลี่ยนรหัสผ่าน อุปกรณ์อื่นที่เข้าระบบไว้จะถูกออกจากระบบ</small></p>
</section>
{{end}}

{{define "main"}}{{$d := .Data}}
<div class="login">
  <form class="card" method="post" action="/admin/login">
    <div class="brand">{{template "logo"}}<span style="color:var(--leaf)">Peaceful Day Admin</span></div>
    {{with $d.Error}}<div class="alert alert--bad" role="alert">{{.}}</div>{{end}}
    <input type="hidden" name="csrf" value="{{$d.CSRF}}">
    <input type="hidden" name="next" value="{{$d.Next}}">
    <div class="field" style="margin-bottom:12px"><label for="email">อีเมล</label><input type="email" id="email" name="email" required autocomplete="username" value="{{$d.Email}}" autofocus></div>
    <div class="field" style="margin-bottom:18px"><label for="password">รหัสผ่าน</label><input type="password" id="password" name="password" required autocomplete="current-password"></div>
    <button class="btn btn--primary" type="submit" style="width:100%">เข้าสู่ระบบ</button>
    <p class="muted" style="margin-top:14px;font-size:.84rem">ลืมรหัสผ่าน ให้เจ้าของร้านตั้งรหัสใหม่ในหน้า ‘ทีมงานและสิทธิ์’</p>
  </form>
</div>
{{end}}
